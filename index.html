const TOKENS = `
  
  .ps-root{
    --ink:#12241f; --ink-soft:#4d635b; --ink-faint:#8a978f;
    --teal:#123832; --teal-2:#1d4a41; --teal-3:#2a5c50;
    --paper:#f6f4ec; --card:#ffffff; --hair:#e3ddcc; --hair-soft:#ece7d8;
    --amber:#bd8a30; --amber-ink:#5c3f10; --amber-soft:#f2e3c4;
    --green:#2f6d53; --green-soft:#dfece3;
    --red:#b0452f; --red-soft:#f5e0da;
    --blue:#3a5b74; --blue-soft:#e2eaef;
    font-family:'Inter',sans-serif; color:var(--ink); background:var(--paper);
  }
  .ps-h{font-family:'Manrope',sans-serif;}
  .ps-mono{font-family:'IBM Plex Mono',monospace;}
  .ps-sidebar{background:linear-gradient(180deg,var(--teal),#0d2b26);}
  .ps-nav{color:rgba(255,255,255,.68); border-left:3px solid transparent; transition:background .15s,color .15s;}
  .ps-nav:hover{color:#fff; background:rgba(255,255,255,.06);}
  .ps-nav.active{color:#fff; background:rgba(255,255,255,.09); border-left:3px solid var(--amber);}
  .ps-card{background:var(--card); border:1px solid var(--hair);}
  .ps-hero{background:linear-gradient(135deg,var(--teal),#0e2f2a); color:#fff;}
  .ps-btn{background:var(--amber); color:#241a06; font-weight:600; transition:background .15s,transform .1s;}
  .ps-btn:hover{background:#a97b28;}
  .ps-btn:active{transform:scale(.98);}
  .ps-btn-ghost{background:transparent; border:1px solid var(--hair); color:var(--ink); font-weight:600;}
  .ps-btn-ghost:hover{background:var(--hair-soft);}
  .ps-btn-teal{background:var(--teal); color:#fff; font-weight:600;}
  .ps-btn-teal:hover{background:var(--teal-2);}
  .ps-btn-danger{background:var(--red); color:#fff; font-weight:600;}
  .ps-btn-danger:hover{background:#973a27;}
  .ps-input{border:1px solid var(--hair); background:#fff; color:var(--ink);}
  .ps-input:focus{outline:none; border-color:var(--teal-3); box-shadow:0 0 0 3px rgba(18,56,50,.1);}
  .ps-badge{font-size:12px; font-weight:600; padding:3px 9px; border-radius:100px; display:inline-flex; align-items:center; gap:5px; white-space:nowrap;}
  .badge-green{background:var(--green-soft); color:var(--green);}
  .badge-red{background:var(--red-soft); color:var(--red);}
  .badge-amber{background:var(--amber-soft); color:var(--amber-ink);}
  .badge-blue{background:var(--blue-soft); color:var(--blue);}
  .badge-grey{background:var(--hair-soft); color:var(--ink-soft);}
  .ps-scroll::-webkit-scrollbar{width:8px; height:8px;}
  .ps-scroll::-webkit-scrollbar-thumb{background:var(--hair); border-radius:8px;}
  .ps-tab{color:var(--ink-soft); border-bottom:2px solid transparent; font-weight:600;}
  .ps-tab.active{color:var(--teal); border-bottom:2px solid var(--amber);}
  .ps-row:hover{background:#faf8f2;}
  .ps-checkbtn{background:var(--amber); box-shadow:0 6px 18px rgba(189,138,48,.35);}
  .ps-checkbtn:active{transform:scale(.97);}
  .ps-focusring:focus-visible{outline:2px solid var(--teal-3); outline-offset:2px;}

  /* utility classes replacing Tailwind arbitrary-value syntax (no JIT compiler here) */
  .t-faint{color:var(--ink-faint);} .t-soft{color:var(--ink-soft);} .t-teal{color:var(--teal);}
  .t-red{color:var(--red);} .t-green{color:var(--green);} .t-blue{color:var(--blue);} .t-amberink{color:var(--amber-ink);}
  .bg-hairsoft{background:var(--hair-soft);} .bg-paper{background:var(--paper);} .bg-teal{background:var(--teal);}
  .bg-red{background:var(--red);} .bg-green{background:var(--green);} .bg-amber{background:var(--amber);}
  .topbar-bg{background:rgba(246,244,236,.95); backdrop-filter:blur(6px);}
  .ink-on-amber{color:#241a06;}
  .fs-9{font-size:9px;} .fs-10{font-size:10px;} .fs-11{font-size:11px;} .fs-15{font-size:15px;} .fs-28{font-size:28px;}
  .tw-50{color:rgba(255,255,255,.5);} .tw-55{color:rgba(255,255,255,.55);} .tw-70{color:rgba(255,255,255,.7);}
  .tw-75{color:rgba(255,255,255,.75);} .tw-85{color:rgba(255,255,255,.85);}
  .bw-10{background:rgba(255,255,255,.1);} .bw-20{background:rgba(255,255,255,.2);}
  .bb-40{background:rgba(0,0,0,.4);}
  .hover-hairsoft:hover{background:var(--hair-soft);}
  .hover-bw20:hover{background:rgba(255,255,255,.2);}

  /* RTL overrides — flexbox/grid already mirror automatically via [dir="rtl"],
     these only fix the handful of *physical* (non-logical) positions we used
     (absolute icon offsets, border-side accents, dropdown anchoring). */
  [dir="rtl"] .ps-nav.active{ border-left:none; border-right:3px solid var(--amber); }
  [dir="rtl"] .search-icon{ left:auto; right:0.75rem; }
  [dir="rtl"] .search-input{ padding-left:0.75rem; padding-right:2.25rem; }
  [dir="rtl"] .notif-dropdown{ right:auto; left:0; }
  .grid > *{ min-width:0; }
  html, body{ overflow-x:hidden; max-width:100vw; }
  @media (max-width:640px){
    /* pin to the screen edges so the panel can never be clipped, in LTR or RTL */
    .notif-dropdown, [dir="rtl"] .notif-dropdown{ position:fixed !important; left:0.5rem !important; right:0.5rem !important; top:3.75rem !important; width:auto !important; max-width:none !important; margin-top:0 !important; }
  }
  [dir="rtl"] .ps-mono{ direction:ltr; unicode-bidi:embed; } /* keep codes/times/currency LTR-shaped */
`;

        const shiftName = weeklyAssignments[empId]?.[weekday];
        const existing = attendance.find((a) => a.employeeId === empId && a.date === DEMO_DATE);

            showToast("Already checked in today.");
            return;

        if (existing && (existing.status === "Leave" || existing.status === "Holiday")) {
            showToast(`You're on ${existing.status.toLowerCase()} today — a manager can override this in Attendance.`);
            return;
        }
        if (!shiftName || shiftName === "Off") {
            showToast("You're not scheduled to work today.");
            return;
        }
        const now = nowTimeStr(); // real wall-clock time — this is what "current application time" means in the demo
        const def = SHIFT_TYPES[shiftName];
        const diff = toMin(now) - toMin(def.start);
        const lateMinutes = diff > 0 ? diff : 0;
        const status = lateMinutes > 0 ? "Late" : "Present";
        if (existing) {
            setAttendance((list) => list.map((a) => (a.id === existing.id ? { ...a, checkIn: now, status, lateMinutes } : a)));
        }
        else {
            setAttendance((list) => [{ id: nextId("att"), employeeId: empId, date: DEMO_DATE, status, checkIn: now, checkOut: null, lateMinutes, workingHours: 0, note: "" }, ...list]);
        }

            return;
        }
        if (today.checkOut) {

            return;

        const now = nowTimeStr();
        const weekday = weekdayOf(DEMO_DATE);
        const shiftName = weeklyAssignments[empId]?.[weekday];
        const breakMins = shiftName && shiftName !== "Off" ? SHIFT_TYPES[shiftName].breakMins : 30;
